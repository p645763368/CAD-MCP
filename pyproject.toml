[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocad-mcp-pro"
version = "1.6.0.post5"
description = "Maintained portable AutoCAD 2026 MCP architectural tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "ezdxf==1.4.5", "fastmcp==3.4.9", "pydantic==2.14.1",
  "pillow==13.0.0", "matplotlib==3.11.2", "openpyxl==3.1.5",
  "pywin32==312; sys_platform == 'win32'",
]

[project.scripts]
autocad-mcp = "cad_mcp_launcher:main"
autocad-mcp-install-native = "cad_mcp_deploy:install_main"
autocad-mcp-config = "cad_mcp_deploy:config_main"
autocad-mcp-doctor = "cad_mcp_deploy:doctor_main"

[tool.setuptools]
package-dir = {"" = "latest/python"}
py-modules = ["server", "config", "security", "version", "arch_tools", "arch_deep_tools", "project_fixes", "cad_mcp_paths", "cad_mcp_launcher", "cad_mcp_deploy", "precision_tools", "cad_mcp_status"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["latest/python"]
include = ["backends*", "engineering*", "discovery*", "templates"]
namespaces = true

[tool.setuptools.package-data]
templates = ["*.dwt", "*.dxf", "*.md"]
discovery = ["*.tsv", "*.json"]

[tool.setuptools.data-files]
"share/cad-mcp/native/CadMcpNative2026.bundle/Contents/Win64" = ["latest/native/CadMcpNative2026.bundle/Contents/Win64/CadMcpNative2026.dll"]
"share/cad-mcp/native/CadMcpArch2026V2Safe.bundle/Contents/Win64" = ["latest/native/CadMcpArch2026V2Safe.bundle/Contents/Win64/CadMcpArch2026V2Safe.dll"]
"share/cad-mcp/native/CadMcpProjectFix2026.bundle/Contents/Win64" = ["latest/native/CadMcpProjectFix2026.bundle/Contents/Win64/CadMcpProjectFix2026.dll"]

"share/cad-mcp/native/CadMcpStatus2026.bundle/Contents/Win64" = ["latest/native/CadMcpStatus2026.bundle/Contents/Win64/CadMcpStatus2026.dll", "latest/native/CadMcpStatus2026.bundle/Contents/Win64/CadMcpStatusIcons2026.dll"]
"share/cad-mcp/native/CadMcpStatus2026.bundle" = ["latest/native/CadMcpStatus2026.bundle/PackageContents.xml"]
